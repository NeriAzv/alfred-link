<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfred</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alfred">
<meta name="theme-color" content="#1f6f5f">
<style>html,body{height:100%;margin:0;background:#111312;color:#eceae3;font:16px system-ui,-apple-system,sans-serif;display:grid;place-items:center;text-align:center}a{color:#4fb89d}p{margin:0;padding:0 24px;line-height:1.5}</style>
</head><body>
<p id="aviso">Abrindo o Alfred… <a id="link" href="https://architectural-flower-rays-arranged.trycloudflare.com">toque aqui se não abrir</a></p>
<script>
(async () => {
  var destino = "https://architectural-flower-rays-arranged.trycloudflare.com";
  try {
    var r = await fetch("endereco.json?v=" + Date.now(), { cache: "no-store" });
    if (r.ok) { var d = await r.json(); if (d && d.endereco) destino = d.endereco; }
  } catch (e) {}
  document.getElementById("link").href = destino;
  location.replace(destino);
})();
</script>
</body></html>
